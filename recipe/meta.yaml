{% set name = "grpcio-gcp" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/GoogleCloudPlatform/grpc-gcp-python/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 44de25348f489920efb3b1a05134816cfbc3e880fa92e3a7b4dfcb7e772ac625

build:
  number: 4
  script:
    - cp template/version.py src/
    - cp src/LICENSE .
    - cd src
    - python -m grpc_tools.protoc -I. --python_out=./grpc_gcp/proto --grpc_python_out=./grpc_gcp/proto grpc_gcp.proto
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - grpcio-tools
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - grpcio >=1.16.0
    - protobuf >=3.6.1

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - google.protobuf
    - grpc
    - grpc_gcp
    - grpc_gcp.proto
    - grpc_gcp.proto.grpc_gcp_pb2

about:
  home: https://grpc.io
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: gRPC extensions for Google Cloud Platform
  description: |
    **gRPC-GCP Python**

    This repo is created to support GCP specific extensions for gRPC.
    To use the extension features, please refer to grpcio-gcp.

    This repo also contains supporting infrastructures such as
    end2end tests and benchmarks for accessing cloud APIs with gRPC client libraries.
  doc_url: https://grpc.io/docs/
  dev_url: https://github.com/GoogleCloudPlatform/grpc-gcp-python

extra:
  recipe-maintainers:
    - BrentDorsey
